name: Import final local assets

on:
  push:
    branches:
      - fix/final-trip-updates-aug12
    paths:
      - assets-payload.b64
      - .github/workflows/import-final-assets-temp.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-trip-updates-aug12
      - name: Decode and commit local images
        shell: bash
        run: |
          base64 --decode assets-payload.b64 > /tmp/nn-final-assets.tar.gz
          tar -xzf /tmp/nn-final-assets.tar.gz
          rm -f assets-payload.b64
          rm -f assets/events/polnalyubvi/.gitkeep
          rm -f .github/workflows/import-final-assets-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets .github/workflows/import-final-assets-temp.yml assets-payload.b64
          git commit -m "Add local event and venue images"
          git push
