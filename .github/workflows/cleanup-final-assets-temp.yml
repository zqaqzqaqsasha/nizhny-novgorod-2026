name: Clean final asset metadata

on:
  push:
    branches:
      - fix/final-trip-updates-aug12
    paths:
      - .github/workflows/cleanup-final-assets-temp.yml

permissions:
  contents: write

jobs:
  clean-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-trip-updates-aug12
      - name: Remove macOS metadata and temporary workflow
        shell: bash
        run: |
          find assets -name '._*' -type f -delete
          rm -f .github/workflows/cleanup-final-assets-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary asset metadata"
          git push
